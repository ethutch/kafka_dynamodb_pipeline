[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-dynamodb-pipeline"
version = "1.0.0"
description = "Enterprise Kafka -> DynamoDB pipeline service"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "protobuf>=7.36.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.14.1",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "boto3>=1.43.0",
    "boto3-stubs[dynamodb]>=1.43.0",
    "coverage>=7.16.0",
    "moto[dynamodb]>=5.2.3",
    "mypy>=2.1.0",
   "mypy-boto3-dynamodb>=1.43.0,<1.44.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
    "aws-lambda-typing>=2.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kafka_dynamodb_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers --import-mode=importlib"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]

[tool.coverage.run]
source = ["kafka_dynamodb_pipeline"]
omit = ["*/tests/*", "*/proto/*"]

[tool.coverage.report]
show_missing = true